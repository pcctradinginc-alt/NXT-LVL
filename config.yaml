    acceleration: 0.35
    diversity: 0.20
    novelty: 0.15
  edgar_fts:
    enabled: true
    forms: "10-K,10-Q,8-K"
    lookback_days: 90

# ---------------------------------------------------------------------------
# SEC-filing language acceleration (#8): rate-of-change of AI-buildout phrases
# in the hyperscalers' latest 10-Q/10-K vs. their prior one. Defaults to the
# same company set as capex_companies (see src/collectors/edgar_language.py).
# ---------------------------------------------------------------------------

edgar_language:
  enabled: true
  companies:
    - MSFT
    - GOOGL
    - AMZN
    - META
    - ORCL
    - NVDA
  # Multi-word phrases preferred (single generic words like "cloud"/"power"
  # produce XBRL-taxonomy substring noise). Includes the real filing spellings
  # verified against live 10-Qs (e.g. hyperscalers write "datacenter" one word,
  # and "remaining performance obligations" rather than "backlog").
  phrases:
    - "artificial intelligence"
    - "ai demand"
    - "backlog"
    - "remaining performance obligations"
    - "capacity constrained"
    - "capacity constraints"
    - "lead times"
    - "liquid cooling"
    - "grid interconnect"
    - "custom silicon"
    - "data center"
    - "datacenter"
    - "capital expenditures"
    - "power constraints"
    - "power availability"
    - "customer concentration"

reward:
  benchmark_symbol: "SPY"
  horizons: [30, 60, 90, 180]
  primary_horizon: 90
  weight_bounds:
    min: 0.05
    max: 0.45
  step_max: 0.02
  learning_rate: 0.04
  reliability_bounds:
    min: 0.5
    max: 1.5
  min_samples: 5
  overheated_score_threshold: 80
  # Global evidence gate: min_samples above only gates a single ledger
  # ENTRY (one feature/source), which is meaningless protection while the
  # overall ledger is tiny and self-reinforcing. min_matured_signals gates
  # weight adaptation GLOBALLY: the ledger keeps accumulating every run
  # (pure bookkeeping), but production feature weights/source reliabilities
  # are not allowed to move away from their base/config values until the
  # cumulative count of matured signal-horizon evaluations reaches this
  # threshold. See src/reward/engine.py recompute_weights.
  min_matured_signals: 150
